<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EmpleoJoven 360</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <header>
        <nav>
            <h1>EmpleoJoven 360</h1>

            <ul>
                
                 <li>
<a href="#"
onclick="ingresar()">
Ingresar
</a>
</li>


            </ul>
        </nav>
    </header>

    <section class="hero">

    <div class="hero-text">

        <h2>Conectando talento joven con oportunidades reales</h2>

        <p>
            Impulsamos el empleo digno, la formación profesional y las
            oportunidades laborales para jóvenes colombianos.
        </p>

        <div class="botones">
            <button onclick="window.location.href='vacantes.html'">
    Buscar Empleo
</button>
            <button class="secundario"
onclick="window.location.href='registro.html'">
    Registrarme
</button>
        </div>

    </div>

    <div class="hero-imagen">

        <img src="img/empleojoven.png" alt="EmpleoJoven 360">

    </div>

</section>

<section class="estadisticas">

    <div class="estadistica">
        <h3>5000+</h3>
        <p>Jóvenes Registrados</p>
    </div>

    <div class="estadistica">
        <h3>120+</h3>
        <p>Empresas Aliadas</p>
    </div>

    <div class="estadistica">
        <h3>850+</h3>
        <p>Vacantes Activas</p>
    </div>

    <div class="estadistica">
        <h3>300+</h3>
        <p>Contrataciones</p>
    </div>

</section>

<script>

function miPerfil(){

const usuario =
JSON.parse(
localStorage.getItem(
"usuarioEmpleoJoven"
));

if(usuario){

window.location.href =
"perfil.html";

}

else{

alert(
"No existe ningún perfil registrado."
);

window.location.href =
"registro.html";

}

}

function ingresar(){

let correoIngresado =
prompt(
"Ingrese su correo electrónico"
);

let usuario =
JSON.parse(
localStorage.getItem(
"usuarioEmpleoJoven"
));

if(!usuario){

alert(
"Usuario no registrado."
);

window.location.href =
"registro.html";

return;

}

if(
correoIngresado.trim().toLowerCase() ===
usuario.correo.trim().toLowerCase()
){

localStorage.setItem(
"logueado",
"true"
);

alert(
"Bienvenido " +
usuario.nombre
);

window.location.href =
"home.html";

}

else{

alert(
"Correo incorrecto."
);

}

}

</script>

<script>

const logueado =
localStorage.getItem("logueado");

if(logueado === "true"){

    window.location.href =
    "home.html";

}

</script>


</body>

</html>
